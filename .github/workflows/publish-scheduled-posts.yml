# Publishes scheduled blog posts.
#
# Articles in content/blog/ with a future publishAt date are stripped out at
# build time, so they never reach the browser. This workflow rebuilds the site
# every morning; when a post's date arrives, that morning's build includes it.
#
# SETUP (once):
#   1. Vercel → your project → Settings → Git → Deploy Hooks
#      Create a hook named "daily-blog", branch: main. Copy the URL.
#   2. GitHub → repo → Settings → Secrets and variables → Actions → New secret
#      Name: VERCEL_DEPLOY_HOOK       Value: the URL you copied
#
# The URL is a secret because anyone holding it can trigger deploys.

name: Publish scheduled posts

on:
  schedule:
    # 00:30 UTC = 06:00 IST, daily.
    - cron: '30 0 * * *'
  workflow_dispatch:        # lets you publish on demand from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set — see the comment at the top of this file."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Vercel responded $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 400 ]

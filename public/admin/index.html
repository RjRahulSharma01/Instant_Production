<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Not a public page. Keep it out of search results entirely. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Instant Production — Admin</title>
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #050505; }

    /* Shown until the editor takes over, and left visible if it fails to load —
       a blank black screen would give no clue what went wrong. */
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #050505; color: #f5f5f5; text-align: center; padding: 2rem;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    #boot h1 { font-size: 1.05rem; font-weight: 600; margin: 1.25rem 0 .5rem; }
    #boot p  { margin: 0 auto; max-width: 30rem; font-size: .85rem; line-height: 1.75; color: #a1a1aa; }
    #boot a  { color: #f59e0b; }
    .dot {
      width: 9px; height: 9px; border-radius: 999px; background: #f59e0b;
      display: inline-block; animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .8 } }
    .hint { margin-top: 1.5rem; font-size: .75rem; color: #71717a; }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <span class="dot"></span>
      <h1>Opening the editor…</h1>
      <p>
        You will be asked to sign in with GitHub. Access is controlled by who is a
        collaborator on the repository — there is no separate password.
      </p>
      <p class="hint">
        Still here after ten seconds? The editor failed to load.
        Check your connection, then tell Rahul.
        <br />
        <a href="https://vercel.com/dashboard" target="_blank" rel="noopener noreferrer">Vercel dashboard</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/RjRahulSharma01/Instant_Production" target="_blank" rel="noopener noreferrer">Repository</a>
      </p>
    </div>
  </div>

  <!--
    Sveltia CMS — a drop-in replacement for Decap (formerly Netlify CMS) that
    reads the same config.yml. Chosen over Decap because it is markedly faster,
    handles images properly, and is actively maintained.

    It commits straight to the repository over the GitHub API using the token
    from our OAuth handshake in /api/auth and /api/callback. There is no
    database and no server holding your content — the repo remains the single
    source of truth, which is what keeps scheduled publishing and the build-time
    checks working.
  -->
  <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js" type="module"></script>

  <script>
    // Hide the boot screen once the editor has actually rendered.
    var seen = false;
    var check = setInterval(function () {
      if (document.querySelector('#nc-root, .sveltia-cms, [class*="sveltia"]')) {
        seen = true;
        clearInterval(check);
        var b = document.getElementById('boot');
        if (b) b.remove();
      }
    }, 300);
    setTimeout(function () { clearInterval(check); }, 30000);
  </script>
</body>
</html>
